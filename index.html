<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>英語詞彙學習 - Vocabulary App</title>
  <style>
    :root{
      --bg: #f7f5f0; /* warm off-white */
      --surface: #f1eae0; /* warm beige for cards */
      --card-bg: #fffdf9;
      --text: #222326; /* very dark charcoal */
      --muted: #9b968f; /* warm gray */
      --sage: #9aa89a; /* muted sage green */
      --dusty: #8b96a1; /* dusty blue-gray */
      --terracotta: #b76b57; /* muted terracotta */
      --border: rgba(34,35,38,0.08);
      --radius: 20px;
      --shadow: 0 6px 18px rgba(34,35,38,0.06);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Reset */
    *{box-sizing:border-box;margin:0;padding:0}
    html,body,#app{height:100%}
    body{
      font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.4;
      -webkit-tap-highlight-color:transparent;
    }

    /* App layout */
    .app{
      max-width:820px;
      margin:0 auto;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* Compact header */
    header.app-header{
      padding:12px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:transparent;
    }
    .title-wrap{display:flex;flex-direction:column}
    .app-title{font-size:16px;font-weight:600;color:var(--text)}
    .app-sub{font-size:12px;color:var(--muted);margin-top:4px}

    /* Segmented tabs */
    .tabs{
      display:flex;
      gap:8px;
      background:transparent;
      padding:8px 12px;
    }
    .segmented{
      display:flex;
      gap:8px;
      background:rgba(255,255,255,0.6);
      padding:6px;
      border-radius:12px;
      border:1px solid var(--border);
      box-shadow: 0 2px 6px rgba(34,35,38,0.03);
      overflow:hidden;
    }
    .seg-btn{
      padding:8px 12px;font-size:13px;border-radius:10px;background:transparent;border:none;color:var(--muted);cursor:pointer;font-weight:600;
      transition:all 180ms var(--ease);
    }
    .seg-btn.active{background:var(--card-bg);color:var(--text);box-shadow:inset 0 -1px 0 rgba(0,0,0,0.02)}

    main.content{flex:1;padding:12px;display:flex;flex-direction:column;gap:12px}

    /* Progress cards */
    .progress-row{display:flex;gap:10px}
    .stat-card{flex:1;background:var(--card-bg);padding:12px;border-radius:14px;border:1px solid var(--border);box-shadow:var(--shadow);min-height:64px;display:flex;flex-direction:column;justify-content:center}
    .stat-label{font-size:12px;color:var(--muted);margin-bottom:6px}
    .stat-value{font-size:18px;font-weight:700;color:var(--text)}
    .progress-bar-wrap{margin-top:8px}
    .bar{height:8px;background:rgba(34,35,38,0.06);border-radius:999px;overflow:hidden}
    .bar-fill{height:100%;background:linear-gradient(90deg,var(--sage), #8aa38f);width:0%;transition:width 520ms var(--ease)}

    /* Card area */
    .card-area{flex:1;display:flex;align-items:center;justify-content:center;padding:6px}
    .card-outer{width:100%;max-width:520px;min-height:300px;padding:14px}

    .flashcard{
      width:100%;height:100%;min-height:260px;background:var(--card-bg);border-radius:var(--radius);border:1px solid var(--border);
      box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;padding:20px;position:relative;perspective:1200px;overflow:visible
    }

    .card-inner{
      width:100%;height:100%;border-radius:calc(var(--radius) - 2px);position:relative;transform-style:preserve-3d;transition:transform 520ms var(--ease);
    }
    .flashcard.flipped .card-inner{transform:rotateY(180deg)}

    .card-face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
    .face-front{color:var(--text)}
    .face-back{transform:rotateY(180deg);color:var(--text)}

    .word-large{font-size:44px;font-weight:700;letter-spacing:0.6px}
    .pron-small{font-size:13px;color:var(--muted);margin-top:6px}

    .meaning{font-size:22px;color:var(--sage);margin-top:6px;font-weight:600}
    .def{margin-top:8px;font-size:14px;color:var(--dusty);line-height:1.5}
    .example{margin-top:12px;font-size:13px;color:var(--muted);background:rgba(139,150,161,0.04);padding:10px;border-radius:10px;border-left:3px solid rgba(154,168,154,0.18)}

    /* Controls */
    .controls{display:flex;flex-direction:column;gap:10px;padding:6px}
    .main-actions{display:flex;gap:10px}
    .btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);font-weight:700;font-size:15px;cursor:pointer;background:transparent;color:var(--text);transition:transform 140ms var(--ease),opacity 140ms var(--ease)}
    .btn:active{transform:scale(0.97)}
    .btn-know{background:linear-gradient(180deg, rgba(154,168,154,0.12), rgba(154,168,154,0.06));color:var(--sage);border-color:rgba(154,168,154,0.16)}
    .btn-unk{background:linear-gradient(180deg, rgba(183,107,87,0.08), rgba(183,107,87,0.04));color:var(--terracotta);border-color:rgba(183,107,87,0.12)}
    .btn-light{background:transparent;color:var(--muted);font-weight:600}

    .small-actions{display:flex;gap:8px;justify-content:space-between;align-items:center}
    .icon-btn{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer}

    /* Lists */
    .list{display:flex;flex-direction:column;gap:10px}
    .list-item{background:var(--card-bg);padding:12px;border-radius:12px;border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
    .list-left{display:flex;flex-direction:column}
    .list-title{font-weight:700;color:var(--text)}
    .list-sub{font-size:13px;color:var(--muted)}
    .list-actions{display:flex;gap:8px}
    .pill{font-size:12px;padding:6px 8px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted)}

    /* Modal */
    .modal{position:fixed;inset:0;background:rgba(16,16,16,0.36);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:1000}
    .modal.active{display:flex}
    .sheet{width:100%;max-width:700px;background:var(--card-bg);border-radius:16px 16px 10px 10px;padding:18px;border:1px solid var(--border);box-shadow:0 -8px 30px rgba(34,35,38,0.12)}
    .form-row{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
    label{font-size:13px;color:var(--muted);font-weight:600}
    input,textarea{padding:10px;border-radius:10px;border:1px solid var(--border);background:white;font-size:15px}
    textarea{min-height:84px}
    .sheet-actions{display:flex;gap:10px}

    /* Bottom nav for mobile */
    .bottom{padding:12px;background:transparent}

    /* Empty state */
    .empty{padding:28px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.5));border:1px solid var(--border);text-align:center;color:var(--muted)}

    /* Responsive */
    @media (max-width:600px){
      .word-large{font-size:36px}
      .flashcard{min-height:220px}
      .card-outer{padding:8px}
      .segmented{padding:4px}
      .stat-value{font-size:16px}
    }

    /* reduced motion */
    @media (prefers-reduced-motion:reduce){
      .card-inner,.bar-fill{transition:none!important}
    }
  </style>
</head>
<body>
  <div id="app" class="app">
    <header class="app-header">
      <div class="title-wrap">
        <div class="app-title">詞彙學習</div>
        <div class="app-sub">英語詞彙練習</div>
      </div>
      <div class="segmented" role="tablist" aria-label="主要選單">
        <button class="seg-btn active" data-tab="study">學習</button>
        <button class="seg-btn" data-tab="review">錯詞本</button>
        <button class="seg-btn" data-tab="custom">我的詞彙</button>
        <button class="seg-btn" data-tab="settings">設定</button>
      </div>
    </header>

    <main class="content">
      <!-- Progress -->
      <div class="progress-row">
        <div class="stat-card">
          <div class="stat-label">今日進度</div>
          <div class="stat-value" id="currentCard">0 / 0</div>
          <div class="progress-bar-wrap">
            <div class="bar"><div class="bar-fill" id="progressFill"></div></div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-label">已掌握</div>
          <div class="stat-value" id="knownCount">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">待複習</div>
          <div class="stat-value" id="unknownCount">0</div>
        </div>
      </div>

      <!-- Study Screen -->
      <section id="study" class="screen">
        <div class="card-area">
          <div class="card-outer">
            <div class="flashcard" id="flashcard" aria-live="polite">
              <div class="card-inner" id="cardInner">
                <div class="card-face face-front" id="faceFront">
                  <div class="word-large" id="wordDisplay">Word</div>
                  <div class="pron-small" id="pronunciationSmall"></div>
                </div>
                <div class="card-face face-back" id="faceBack">
                  <div class="meaning" id="chineseDisplay">中文釋義</div>
                  <div class="def" id="definitionDisplay">英文定義</div>
                  <div class="example" id="exampleDisplay">例句</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="controls">
          <div class="main-actions">
            <button class="btn btn-unk" id="btnUnknown">不認識</button>
            <button class="btn btn-know" id="btnKnown">認識</button>
          </div>

          <div class="small-actions">
            <div style="display:flex;gap:8px">
              <button class="icon-btn" id="btnPrev">上一個</button>
              <button class="icon-btn" id="btnNext">下一個</button>
            </div>
            <div style="display:flex;gap:8px">
              <button class="icon-btn" id="btnSpeak">發音</button>
              <button class="icon-btn" id="btnShuffle">隨機</button>
              <button class="icon-btn" id="btnReset">重置</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Review Screen -->
      <section id="review" class="screen" style="display:none">
        <div id="reviewList" class="list"></div>
        <div id="reviewEmpty" class="empty" style="display:none">目前沒有待複習的詞彙。太棒了！</div>
      </section>

      <!-- Custom Screen -->
      <section id="custom" class="screen" style="display:none">
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:6px">
          <button class="btn" id="btnAddCustom">新增詞彙</button>
          <div class="pill">自訂詞彙：<span id="customCount">0</span></div>
        </div>
        <div id="customList" class="list"></div>
        <div id="customEmpty" class="empty" style="display:none">尚未新增任何自訂詞彙。</div>
      </section>

      <!-- Settings -->
      <section id="settings" class="screen" style="display:none">
        <div style="display:flex;flex-direction:column;gap:10px">
          <div class="stat-card">
            <div class="stat-label">資料管理</div>
            <div style="display:flex;gap:8px;margin-top:8px">
              <button class="btn btn-light" id="btnExport">匯出資料</button>
              <button class="btn btn-light" id="btnClear">清除所有資料</button>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-label">應用資訊</div>
            <div style="margin-top:8px;color:var(--muted);font-size:13px">
              Vocabulary App • 本地儲存於瀏覽器 (localStorage)
            </div>
          </div>
        </div>
      </section>

    </main>

    <div class="bottom">
      <nav style="max-width:820px;margin:0 auto;display:flex;justify-content:center;gap:8px">
        <button class="pill" data-tab="study">學習</button>
        <button class="pill" data-tab="review">錯詞本</button>
        <button class="pill" data-tab="custom">我的詞彙</button>
        <button class="pill" data-tab="settings">設定</button>
      </nav>
    </div>
  </div>

  <!-- Modal sheet for add/edit -->
  <div class="modal" id="modal">
    <div class="sheet">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-weight:700">新增 / 編輯詞彙</div>
        <button class="icon-btn" id="modalClose">關閉</button>
      </div>
      <form id="wordForm">
        <div class="form-row">
          <label>English Word *</label>
          <input id="fWord" required />
        </div>
        <div class="form-row">
          <label>Chinese Meaning *</label>
          <input id="fChinese" required />
        </div>
        <div class="form-row">
          <label>English Definition</label>
          <textarea id="fDefinition"></textarea>
        </div>
        <div class="form-row">
          <label>Example Sentence</label>
          <textarea id="fExample"></textarea>
        </div>
        <div class="sheet-actions">
          <button class="btn btn-know" type="submit">儲存</button>
          <button class="btn btn-light" type="button" id="cancelForm">取消</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    /* Data & storage keys preserved */
    const STORAGE_KEYS = {all:'allWords', known:'knownWords', unknown:'unknownWords', custom:'customWords', idx:'currentIndex'};

    const defaultWords = [
      // IELTS 高频学术词 & Accounting terms (Traditional Chinese meanings)
      {word: "Analyze", chinese: "分析", definition: "Examine methodically and in detail.", pronunciation: "/ˈænəlaɪz/", example: "The study aims to analyze the data."},
      {word: "Assess", chinese: "評估", definition: "Evaluate or estimate the nature, ability, or quality of.", pronunciation: "/əˈsɛs/", example: "We need to assess the impact."},
      {word: "Significant", chinese: "重要的；顯著的", definition: "Sufficiently great or important to be worthy of attention.", pronunciation: "/sɪɡˈnɪfɪkənt/", example: "There was a significant increase."},
      {word: "Coherent", chinese: "連貫的", definition: "Logical and consistent.", pronunciation: "/kəʊˈhɪərənt/", example: "The argument was coherent."},
      {word: "Sufficient", chinese: "足夠的", definition: "Enough; adequate.", pronunciation: "/səˈfɪʃənt/", example: "There is sufficient evidence."},
      {word: "Illustrate", chinese: "說明；闡明", definition: "Explain or make (something) clear by using examples.", pronunciation: "/ˈɪləstreɪt/", example: "The diagram helps illustrate the process."},
      {word: "Implication", chinese: "含意；可能的影響", definition: "A possible effect or result of an action or a decision.", pronunciation: "/ˌɪmplɪˈkeɪʃən/", example: "Consider the implications of the policy."},
      {word: "Hypothesis", chinese: "假設", definition: "A proposed explanation made on the basis of limited evidence.", pronunciation: "/haɪˈpɒθəsɪs/", example: "The hypothesis was tested."},
      {word: "Sustainable", chinese: "可持續的", definition: "Able to be maintained at a certain rate or level.", pronunciation: "/səˈsteɪnəbəl/", example: "We aim for sustainable growth."},
      {word: "Aggregate", chinese: "總計；集成", definition: "Formed or calculated by the combination of several separate elements.", pronunciation: "/ˈæɡrɪɡət/", example: "Aggregate demand increased."},
      // Accounting-specific
      {word: "Asset", chinese: "資產", definition: "A resource with economic value owned by an individual or corporation.", pronunciation: "/ˈæsɛt/", example: "The company sold some assets."},
      {word: "Liability", chinese: "負債", definition: "A company's legal debts or obligations.", pronunciation: "/ˌlaɪəˈbɪlɪti/", example: "Long-term liabilities rose."},
      {word: "Revenue", chinese: "營收；收入", definition: "Income generated from normal business operations.", pronunciation: "/ˈrɛvəˌnuː/", example: "Annual revenue increased."},
      {word: "Expense", chinese: "費用；支出", definition: "The economic costs a business incurs through operations.", pronunciation: "/ɪkˈspɛns/", example: "Reduce operating expenses."},
      {word: "Depreciation", chinese: "折舊", definition: "A reduction in the value of an asset over time.", pronunciation: "/dɪˌpriːʃiˈeɪʃən/", example: "Depreciation affects net income."},
      {word: "Accrual", chinese: "應計；應計項目", definition: "An accounting method that records revenues when earned and expenses when incurred.", pronunciation: "/əˈkruːəl/", example: "Use accrual accounting principles."},
      {word: "Audit", chinese: "稽核；查帳", definition: "An official inspection of an organization's accounts.", pronunciation: "/ˈɔːdɪt/", example: "The audit was completed."},
      {word: "Equity", chinese: "權益；股東權益", definition: "The value of shares issued by a company.", pronunciation: "/ˈekwɪti/", example: "Shareholders' equity increased."}
    ];

    let allWords=[], knownWords=[], unknownWords=[], customWords=[], currentIndex=0;
    let editIndex = null; // for editing custom words

    /* Elements */
    const app = document.getElementById('app');
    const segBtns = document.querySelectorAll('.seg-btn');
    const bottomPills = document.querySelectorAll('[data-tab]');
    const screens = document.querySelectorAll('.screen');

    const wordDisplay = document.getElementById('wordDisplay');
    const pronunciationSmall = document.getElementById('pronunciationSmall');
    const chineseDisplay = document.getElementById('chineseDisplay');
    const definitionDisplay = document.getElementById('definitionDisplay');
    const exampleDisplay = document.getElementById('exampleDisplay');
    const progressFill = document.getElementById('progressFill');
    const currentCard = document.getElementById('currentCard');
    const knownCountEl = document.getElementById('knownCount');
    const unknownCountEl = document.getElementById('unknownCount');

    const flashcard = document.getElementById('flashcard');
    const cardInner = document.getElementById('cardInner');

    const btnKnown = document.getElementById('btnKnown');
    const btnUnknown = document.getElementById('btnUnknown');
    const btnNext = document.getElementById('btnNext');
    const btnPrev = document.getElementById('btnPrev');
    const btnSpeak = document.getElementById('btnSpeak');
    const btnShuffle = document.getElementById('btnShuffle');
    const btnReset = document.getElementById('btnReset');

    const reviewList = document.getElementById('reviewList');
    const reviewEmpty = document.getElementById('reviewEmpty');

    const customList = document.getElementById('customList');
    const customEmpty = document.getElementById('customEmpty');
    const customCount = document.getElementById('customCount');

    const modal = document.getElementById('modal');
    const modalClose = document.getElementById('modalClose');
    const btnAddCustom = document.getElementById('btnAddCustom');
    const wordForm = document.getElementById('wordForm');
    const fWord = document.getElementById('fWord');
    const fChinese = document.getElementById('fChinese');
    const fDefinition = document.getElementById('fDefinition');
    const fExample = document.getElementById('fExample');
    const cancelForm = document.getElementById('cancelForm');

    /* Init */
    function loadData(){
      allWords = JSON.parse(localStorage.getItem(STORAGE_KEYS.all)) || [];
      knownWords = JSON.parse(localStorage.getItem(STORAGE_KEYS.known)) || [];
      unknownWords = JSON.parse(localStorage.getItem(STORAGE_KEYS.unknown)) || [];
      customWords = JSON.parse(localStorage.getItem(STORAGE_KEYS.custom)) || [];
      currentIndex = parseInt(localStorage.getItem(STORAGE_KEYS.idx)) || 0;

      if(!allWords || allWords.length===0){
        allWords = JSON.parse(JSON.stringify(defaultWords));
        saveData();
      }
    }

    function saveData(){
      localStorage.setItem(STORAGE_KEYS.all, JSON.stringify(allWords));
      localStorage.setItem(STORAGE_KEYS.known, JSON.stringify(knownWords));
      localStorage.setItem(STORAGE_KEYS.unknown, JSON.stringify(unknownWords));
      localStorage.setItem(STORAGE_KEYS.custom, JSON.stringify(customWords));
      localStorage.setItem(STORAGE_KEYS.idx, currentIndex);
    }

    function getWorkingList(){
      if(unknownWords && unknownWords.length>0){
        return unknownWords.concat(allWords.filter(w=>!unknownWords.find(u=>u.word===w.word)));
      }
      return allWords;
    }

    function renderCard(){
      const list = getWorkingList();
      if(list.length===0){
        wordDisplay.textContent='無詞彙';
        pronunciationSmall.textContent='';
        chineseDisplay.textContent='';
        definitionDisplay.textContent='';
        exampleDisplay.textContent='';
        currentCard.textContent = '0 / 0';
        progressFill.style.width='0%';
        return;
      }
      if(currentIndex >= list.length) currentIndex = 0;
      const card = list[currentIndex];
      wordDisplay.textContent = card.word || '';
      pronunciationSmall.textContent = card.pronunciation || '';
      chineseDisplay.textContent = card.chinese || '';
      definitionDisplay.textContent = card.definition || '無英文定義';
      exampleDisplay.textContent = card.example || '無例句';
      // reset flip
      flashcard.classList.remove('flipped');
      updateStats();
      saveData();
    }

    function updateStats(){
      const total = allWords.length || 0;
      const known = knownWords.length || 0;
      const unknown = unknownWords.length || 0;
      const progress = total>0 ? Math.round((known/total)*100) : 0;
      currentCard.textContent = `${currentIndex+1} / ${getWorkingList().length}`;
      progressFill.style.width = progress+'%';
      knownCountEl.textContent = known;
      unknownCountEl.textContent = unknown;
      customCount.textContent = customWords.length;
    }

    /* Flip */
    flashcard.addEventListener('click', ()=>{
      flashcard.classList.toggle('flipped');
    });

    /* Speech */
    function speak(text){
      if(!('speechSynthesis' in window)) return;
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.95;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }

    /* Navigation */
    function nextCard(){
      const list = getWorkingList();
      if(list.length===0) return;
      flashcard.classList.add('swipe-next');
      setTimeout(()=>{ flashcard.classList.remove('swipe-next'); },300);
      currentIndex = (currentIndex < list.length-1) ? currentIndex+1 : 0;
      renderCard();
    }
    function prevCard(){
      const list = getWorkingList();
      if(list.length===0) return;
      currentIndex = (currentIndex>0) ? currentIndex-1 : list.length-1;
      renderCard();
    }

    /* Mark known / unknown */
    function markKnown(){
      const list = getWorkingList();
      if(list.length===0) return;
      const w = list[currentIndex];
      if(!knownWords.find(x=>x.word===w.word)) knownWords.push(w);
      unknownWords = unknownWords.filter(x=>x.word!==w.word);
      saveData();
      nextCard();
    }
    function markUnknown(){
      const list = getWorkingList();
      if(list.length===0) return;
      const w = list[currentIndex];
      if(!unknownWords.find(x=>x.word===w.word)) unknownWords.push(w);
      knownWords = knownWords.filter(x=>x.word!==w.word);
      saveData();
      // show chinese meaning immediately by flipping the card, then proceed after short delay
      flashcard.classList.add('flipped');
      updateStats();
      setTimeout(()=>{ nextCard(); }, 1400);
    }

    /* Shuffle & Reset */
    function shuffle(){
      const list = getWorkingList();
      for(let i=list.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [list[i],list[j]]=[list[j],list[i]];
      }
      currentIndex=0; renderCard(); saveData();
    }
    function resetStudy(){ currentIndex=0; renderCard(); }

    /* Accuracy */
    function calculateAccuracy(){
      const total = allWords.length||0;
      const known = knownWords.length||0;
      const acc = total>0 ? Math.round((known/total)*100) : 0;
      alert(`準確率: ${acc}% (${known}/${total})`);
    }

    /* Review list */
    function renderReview(){
      reviewList.innerHTML='';
      if(unknownWords.length===0){ reviewEmpty.style.display='block'; return;} else reviewEmpty.style.display='none';
      unknownWords.forEach((w,i)=>{
        const el = document.createElement('div'); el.className='list-item';
        el.innerHTML = `<div class="list-left"><div class="list-title">${w.word}</div><div class="list-sub">${w.chinese}</div></div>`;
        const actions = document.createElement('div'); actions.className='list-actions';
        const mark = document.createElement('button'); mark.className='pill'; mark.textContent='已掌握'; mark.onclick=()=>{ knownWords.push(w); unknownWords.splice(i,1); saveData(); renderReview(); updateStats(); };
        const del = document.createElement('button'); del.className='pill'; del.textContent='刪除'; del.onclick=()=>{ if(confirm('確定刪除？')){ unknownWords.splice(i,1); saveData(); renderReview(); updateStats(); }};
        actions.appendChild(mark); actions.appendChild(del);
        el.appendChild(actions); reviewList.appendChild(el);
      });
    }

    /* Custom list */
    function renderCustom(){
      customList.innerHTML='';
      if(customWords.length===0){ customEmpty.style.display='block'; return;} else customEmpty.style.display='none';
      customWords.forEach((w,i)=>{
        const el = document.createElement('div'); el.className='list-item';
        el.innerHTML = `<div class="list-left"><div class="list-title">${w.word}</div><div class="list-sub">${w.chinese}</div></div>`;
        const actions = document.createElement('div'); actions.className='list-actions';
        const edit = document.createElement('button'); edit.className='pill'; edit.textContent='編輯'; edit.onclick=()=>{ openModalForEdit(i); };
        const del = document.createElement('button'); del.className='pill'; del.textContent='刪除'; del.onclick=()=>{ if(confirm('確定刪除？')){ customWords.splice(i,1); allWords = allWords.filter(x=>x.word!==w.word); saveData(); renderCustom(); updateStats(); renderCard(); }};
        actions.appendChild(edit); actions.appendChild(del);
        el.appendChild(actions); customList.appendChild(el);
      });
    }

    /* Modal actions */
    function openModal(){ modal.classList.add('active'); }
    function closeModal(){ modal.classList.remove('active'); editIndex=null; wordForm.reset(); }
    function openModalForEdit(i){ editIndex=i; const w = customWords[i]; fWord.value=w.word; fChinese.value=w.chinese; fDefinition.value=w.definition||''; fExample.value=w.example||''; openModal(); }

    wordForm.addEventListener('submit',(e)=>{
      e.preventDefault();
      const wordObj = {word:fWord.value.trim(), chinese:fChinese.value.trim(), definition:fDefinition.value.trim(), example:fExample.value.trim(), pronunciation:''};
      if(!wordObj.word || !wordObj.chinese) return alert('請填寫英文與中文');
      if(editIndex===null){
        customWords.push(wordObj); allWords.push(wordObj);
      } else {
        // update custom and allWords
        const prev = customWords[editIndex];
        customWords[editIndex]=wordObj;
        allWords = allWords.map(w=> w.word===prev.word ? wordObj : w);
      }
      saveData(); renderCustom(); updateStats(); renderCard(); closeModal();
    });

    modalClose.addEventListener('click',closeModal);
    cancelForm.addEventListener('click',closeModal);
    btnAddCustom.addEventListener('click',()=>{ editIndex=null; wordForm.reset(); openModal(); });

    /* Buttons */
    btnKnown.addEventListener('click',markKnown);
    btnUnknown.addEventListener('click',markUnknown);
    btnNext.addEventListener('click',nextCard);
    btnPrev.addEventListener('click',prevCard);
    btnSpeak.addEventListener('click',()=>{ const list=getWorkingList(); if(list.length) speak(list[currentIndex].word); });
    btnShuffle.addEventListener('click',shuffle);
    btnReset.addEventListener('click',resetStudy);

    document.getElementById('btnExport').addEventListener('click',()=>{
      const data = {all:allWords, known:knownWords, unknown:unknownWords, custom:customWords};
      const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download='vocabulary-data.json'; a.click(); URL.revokeObjectURL(url);
    });
    document.getElementById('btnClear').addEventListener('click',()=>{
      if(confirm('清除所有本地資料？此動作無法還原。')){
        localStorage.removeItem(STORAGE_KEYS.all); localStorage.removeItem(STORAGE_KEYS.known); localStorage.removeItem(STORAGE_KEYS.unknown); localStorage.removeItem(STORAGE_KEYS.custom); localStorage.removeItem(STORAGE_KEYS.idx);
        loadData(); renderCustom(); renderReview(); renderCard(); updateStats();
      }
    });

    /* Tab switching */
    function showTab(name){
      screens.forEach(s=> s.style.display = (s.id===name)? 'block':'none');
      segBtns.forEach(b=> b.classList.toggle('active', b.dataset.tab===name));
      bottomPills.forEach(b=> { if(b.dataset.tab === name) b.classList.add('active'); else b.classList.remove('active'); });

      if(name==='review') renderReview();
      if(name==='custom') renderCustom();
    }
    segBtns.forEach(b=> b.addEventListener('click', ()=> showTab(b.dataset.tab)));
    bottomPills.forEach(b=> b.addEventListener('click', ()=> showTab(b.dataset.tab)));

    /* init */
    loadData(); renderCard(); renderCustom(); renderReview(); updateStats();

    // small keyboard support
    window.addEventListener('keydown', (e)=>{
      if(e.key==='ArrowRight') nextCard();
      if(e.key==='ArrowLeft') prevCard();
      if(e.key===' ') { e.preventDefault(); flashcard.classList.toggle('flipped'); }
    });

    // expose some functions for legacy compatibility if other scripts used them
    window.speakWord = ()=>{ const list=getWorkingList(); if(list.length) speak(list[currentIndex].word); };
    window.shuffleCards = shuffle;
    window.resetStudy = resetStudy;
    window.calculateAccuracy = calculateAccuracy;
    window.nextCard = nextCard;
    window.previousCard = prevCard;
    window.markKnown = markKnown;
    window.markUnknown = markUnknown;

  </script>
</body>
</html>
